name: transitops

services:
  postgres:
    image: postgis/postgis:17-3.5
    # The tag has no arm64 build, so it runs emulated on Apple Silicon.
    platform: linux/amd64
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transitops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transitops}
      POSTGRES_DB: ${POSTGRES_DB:-transitops}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # TCP (-h 127.0.0.1) so it cannot pass during the image's init phase, which
      # only listens on a unix socket. $$ is resolved inside the container.
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  postgres_data:
